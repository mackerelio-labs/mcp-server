version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "10:30"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 5
      include:
        - "*"
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: daily
      time: "10:30"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 5
      include:
        - "*"
