name: 'Setup latest npm'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 'lts/*'

    - name: Install latest npm
      run: |
        echo "Current npm version: $(npm -v)"
        npm install -g npm@latest
        echo "Updated npm version: $(npm -v)"
      shell: sh
